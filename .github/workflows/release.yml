# Compila el ejecutable y el instalador en Windows.
# - Al publicar una versión en GitHub (Releases): los adjunta a esa versión junto con
#   SHA256SUMS.txt, que la app usa para comprobar el instalador antes de actualizarse.
# - A mano (Actions > Compilar > Run workflow): los deja como artefacto para descargar.
name: Compilar

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Ejecutable
        run: pyinstaller --noconfirm --onefile --noconsole --name KooruiKeyboard --icon assets/icon.ico koorui_battery.pyw

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Instalador
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\koorui.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Huellas SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: KooruiKeyboard
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Adjuntar a la versión
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/KooruiKeyboard.exe dist/KooruiKeyboardSetup.exe dist/SHA256SUMS.txt --clobber
