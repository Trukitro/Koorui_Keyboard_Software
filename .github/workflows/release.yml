# Compila el ejecutable y el instalador en Windows.
# - Al publicar una versión en GitHub (Releases): los adjunta a esa versión.
# - A mano (Actions > Compilar > Run workflow): los deja como artefacto para descargar.
name: Compilar

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Ejecutable
        run: pyinstaller --noconfirm --onefile --noconsole --name KooruiKeyboard --icon assets/icon.ico koorui_battery.pyw

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Instalador
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\koorui.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: KooruiKeyboard
          path: dist/*.exe

      - name: Adjuntar a la versión
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/KooruiKeyboard.exe dist/KooruiKeyboardSetup.exe --clobber
